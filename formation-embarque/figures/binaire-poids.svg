<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 210" font-family="'Segoe UI',Arial,sans-serif">
  <!-- fond explicite : garde la figure lisible en dark mode (GitHub, PDF) -->
  <rect id="fond" width="100%" height="100%" fill="#ffffff"/>
  <style>
    .lbl{fill:#475569;font-size:13px}
    .bit{fill:#1a2332;font-size:26px;font-weight:700}
    .w{fill:#2563eb;font-size:15px;font-weight:600}
    .cell{fill:#f1f5f9;stroke:#cbd5e1;stroke-width:1.5}
    .cellon{fill:#dbeafe;stroke:#2563eb;stroke-width:2}
    .res{fill:#0d9488;font-size:18px;font-weight:700}
  </style>
  <text x="20" y="28" class="lbl" font-size="15" font-weight="600">Nombre binaire 1011 0100 sur 8 bits</text>
  <g>
    <!-- 8 cells -->
    <g transform="translate(20,50)">
      <rect class="cellon" x="0"   y="0" width="60" height="60" rx="6"/>
      <rect class="cell"   x="70"  y="0" width="60" height="60" rx="6"/>
      <rect class="cellon" x="140" y="0" width="60" height="60" rx="6"/>
      <rect class="cellon" x="210" y="0" width="60" height="60" rx="6"/>
      <rect class="cell"   x="280" y="0" width="60" height="60" rx="6"/>
      <rect class="cellon" x="350" y="0" width="60" height="60" rx="6"/>
      <rect class="cell"   x="420" y="0" width="60" height="60" rx="6"/>
      <rect class="cell"   x="490" y="0" width="60" height="60" rx="6"/>
      <text class="bit" x="30"  y="40" text-anchor="middle">1</text>
      <text class="bit" x="100" y="40" text-anchor="middle">0</text>
      <text class="bit" x="170" y="40" text-anchor="middle">1</text>
      <text class="bit" x="240" y="40" text-anchor="middle">1</text>
      <text class="bit" x="310" y="40" text-anchor="middle">0</text>
      <text class="bit" x="380" y="40" text-anchor="middle">1</text>
      <text class="bit" x="450" y="40" text-anchor="middle">0</text>
      <text class="bit" x="520" y="40" text-anchor="middle">0</text>
      <!-- weights -->
      <text class="w" x="30"  y="82" text-anchor="middle">128</text>
      <text class="w" x="100" y="82" text-anchor="middle">64</text>
      <text class="w" x="170" y="82" text-anchor="middle">32</text>
      <text class="w" x="240" y="82" text-anchor="middle">16</text>
      <text class="w" x="310" y="82" text-anchor="middle">8</text>
      <text class="w" x="380" y="82" text-anchor="middle">4</text>
      <text class="w" x="450" y="82" text-anchor="middle">2</text>
      <text class="w" x="520" y="82" text-anchor="middle">1</text>
      <!-- MSB/LSB -->
      <text class="lbl" x="30"  y="105" text-anchor="middle" font-size="11">MSB</text>
      <text class="lbl" x="520" y="105" text-anchor="middle" font-size="11">LSB</text>
    </g>
  </g>
  <text x="20" y="185" class="res">128 + 32 + 16 + 4 = 180</text>
  <text x="330" y="185" class="res" fill="#d97706">= 0xB4</text>
  <text x="450" y="185" class="lbl" font-size="14">(1011 = B, 0100 = 4)</text>
</svg>
