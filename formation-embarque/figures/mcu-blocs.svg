<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300" font-family="'Segoe UI',Arial,sans-serif">
  <style>
    .box{fill:#f8fafc;stroke:#1a2332;stroke-width:2;rx:8}
    .cpu{fill:#dbeafe;stroke:#2563eb;stroke-width:2.5}
    .mem{fill:#d1fae5;stroke:#0d9488;stroke-width:2}
    .peri{fill:#fef3c7;stroke:#d97706;stroke-width:2}
    .t{fill:#1a2332;font-size:14px;font-weight:600;text-anchor:middle}
    .s{fill:#475569;font-size:11px;text-anchor:middle}
    .bus{fill:#334155;font-size:13px;font-weight:700;text-anchor:middle}
  </style>
  <rect x="10" y="10" width="640" height="280" rx="12" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="330" y="32" class="t" font-size="15">MICROCONTRÔLEUR (une seule puce)</text>

  <!-- CPU -->
  <rect class="box cpu" x="40" y="55" width="150" height="70" rx="8"/>
  <text class="t" x="115" y="85">CPU (cœur)</text>
  <text class="s" x="115" y="105">chercher → décoder</text>
  <text class="s" x="115" y="118">→ exécuter</text>

  <!-- Flash -->
  <rect class="box mem" x="255" y="55" width="150" height="70" rx="8"/>
  <text class="t" x="330" y="82">Flash</text>
  <text class="s" x="330" y="100">programme</text>
  <text class="s" x="330" y="114">(non volatile)</text>

  <!-- RAM -->
  <rect class="box mem" x="460" y="55" width="150" height="70" rx="8"/>
  <text class="t" x="535" y="82">RAM (SRAM)</text>
  <text class="s" x="535" y="100">variables, pile</text>
  <text class="s" x="535" y="114">(volatile)</text>

  <!-- BUS -->
  <rect x="40" y="150" width="570" height="34" rx="6" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
  <text class="bus" x="325" y="172">BUS (adresses + données)</text>
  <!-- connectors -->
  <line x1="115" y1="125" x2="115" y2="150" stroke="#334155" stroke-width="2"/>
  <line x1="330" y1="125" x2="330" y2="150" stroke="#334155" stroke-width="2"/>
  <line x1="535" y1="125" x2="535" y2="150" stroke="#334155" stroke-width="2"/>

  <!-- Peripherals -->
  <rect class="box peri" x="40" y="205" width="570" height="65" rx="8"/>
  <text class="t" x="325" y="228" fill="#92400e">Périphériques (pilotés par REGISTRES)</text>
  <text class="s" x="325" y="250">GPIO · UART · SPI · I2C · Timers · PWM · ADC/DAC · CAN · Watchdog</text>
  <line x1="325" y1="184" x2="325" y2="205" stroke="#334155" stroke-width="2"/>
</svg>
