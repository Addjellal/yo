<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 280" font-family="'Segoe UI',Arial,sans-serif">
  <!-- fond explicite : garde la figure lisible en dark mode (GitHub, PDF) -->
  <rect id="fond" width="100%" height="100%" fill="#ffffff"/>
  <style>
    .ttl{fill:#1a2332;font-size:14px;font-weight:700}
    .box{fill:#f8fafc;stroke:#334155;stroke-width:1.8}
    .comb{fill:#dbeafe;stroke:#2563eb;stroke-width:2}
    .ff{fill:#fef3c7;stroke:#d97706;stroke-width:2}
    .t{fill:#1a2332;font-size:12px;font-weight:600;text-anchor:middle}
    .lab{fill:#475569;font-size:12px}
    .wire{stroke:#334155;stroke-width:2;fill:none;marker-end:url(#av)}
    .clk{stroke:#dc2626;stroke-width:2;fill:none}
  </style>
  <defs>
    <marker id="av" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#334155"/></marker>
  </defs>

  <!-- Combinatoire -->
  <text x="20" y="24" class="ttl">Combinatoire — la sortie ne dépend QUE des entrées (pas de mémoire)</text>
  <g transform="translate(0,34)">
    <text class="lab" x="30" y="35">a</text>
    <text class="lab" x="30" y="65">b</text>
    <line class="wire" x1="45" y1="30" x2="120" y2="30"/>
    <line class="wire" x1="45" y1="60" x2="120" y2="60"/>
    <rect class="box comb" x="120" y="15" width="120" height="60" rx="6"/>
    <text class="t" x="180" y="40">logique</text>
    <text class="t" x="180" y="58" font-size="10">(ET/OU/mux…)</text>
    <line class="wire" x1="240" y1="45" x2="315" y2="45"/>
    <text class="lab" x="325" y="49">s</text>
    <text class="lab" x="360" y="49" font-style="italic">s &lt;= a and b;</text>
  </g>

  <!-- Séquentiel -->
  <text x="20" y="150" class="ttl">Séquentiel — la sortie dépend aussi du PASSÉ (registre cadencé)</text>
  <g transform="translate(0,160)">
    <text class="lab" x="30" y="55">d</text>
    <line class="wire" x1="45" y1="50" x2="120" y2="50"/>
    <rect class="box ff" x="120" y="20" width="120" height="70" rx="6"/>
    <text class="t" x="180" y="45">Bascule D</text>
    <text class="t" x="180" y="63" font-size="10">q &lt;= d au front ↑</text>
    <line class="wire" x1="240" y1="55" x2="315" y2="55"/>
    <text class="lab" x="325" y="59">q</text>
    <!-- clock -->
    <path class="clk" d="M120,110 L140,110 L140,95 L160,95 L160,110 L180,110 L180,95 L200,95 L200,110 L220,110"/>
    <line class="clk" x1="180" y1="90" x2="180" y2="118" marker-end="url(#av)"/>
    <text class="lab" x="140" y="128" fill="#dc2626">horloge (clk)</text>
    <text class="lab" x="360" y="59" font-style="italic">if rising_edge(clk)…</text>
  </g>
</svg>
