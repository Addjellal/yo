<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Segoe UI',Arial,sans-serif">
  <style>
    .ttl{fill:#1a2332;font-size:15px;font-weight:600}
    .step{fill:#f8fafc;stroke:#334155;stroke-width:2}
    .init{fill:#f8fafc;stroke:#334155;stroke-width:2}
    .sn{fill:#1a2332;font-size:15px;font-weight:700;text-anchor:middle}
    .act{fill:#1e40af;font-size:12px}
    .actbox{fill:#dbeafe;stroke:#2563eb;stroke-width:1.5}
    .tr{fill:#dc2626;font-size:12px}
    .line{stroke:#334155;stroke-width:2}
  </style>
  <text x="20" y="24" class="ttl">GRAFCET — étapes (actions) séparées par des transitions (conditions)</text>

  <!-- step 0 double border (initial) -->
  <g transform="translate(70,50)">
    <rect class="init" x="0" y="0" width="70" height="45" rx="3"/>
    <rect class="init" x="5" y="5" width="60" height="35" fill="none"/>
    <text class="sn" x="35" y="28">0</text>
    <line class="line" x1="35" y1="45" x2="35" y2="80"/>
    <!-- transition -->
    <line class="line" x1="20" y1="63" x2="50" y2="63"/>
    <text class="tr" x="60" y="67">départ · pièce présente</text>

    <rect class="step" x="0" y="80" width="70" height="45" rx="3"/>
    <text class="sn" x="35" y="108">10</text>
    <rect class="actbox" x="90" y="88" width="150" height="30" rx="4"/>
    <text class="act" x="100" y="107">serrer := 1</text>
    <line class="line" x1="35" y1="125" x2="35" y2="160"/>
    <line class="line" x1="20" y1="143" x2="50" y2="143"/>
    <text class="tr" x="60" y="147">capteur_serré</text>

    <rect class="step" x="0" y="160" width="70" height="45" rx="3"/>
    <text class="sn" x="35" y="188">20</text>
    <rect class="actbox" x="90" y="168" width="180" height="30" rx="4"/>
    <text class="act" x="100" y="187">percer, descendre := 1</text>
    <line class="line" x1="35" y1="205" x2="35" y2="240"/>
    <line class="line" x1="20" y1="223" x2="50" y2="223"/>
    <text class="tr" x="60" y="227">fin_de_course_bas</text>

    <rect class="step" x="0" y="240" width="70" height="45" rx="3"/>
    <text class="sn" x="35" y="268">30</text>
    <rect class="actbox" x="90" y="248" width="150" height="30" rx="4"/>
    <text class="act" x="100" y="267">remonter := 1</text>
    <!-- loop back to 0 -->
    <line class="line" x1="35" y1="285" x2="35" y2="300"/>
    <path class="line" fill="none" d="M35,300 L380,300 L380,22 L35,22"/>
    <text class="tr" x="250" y="296">fin_de_course_haut → retour étape 0</text>
  </g>
</svg>
