<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" font-family="'Segoe UI',Arial,sans-serif">
  <!-- fond explicite : garde la figure lisible en dark mode (GitHub, PDF) -->
  <rect id="fond" width="100%" height="100%" fill="#ffffff"/>
  <style>
    .ttl{fill:#1a2332;font-size:15px;font-weight:600}
    .sig{fill:none;stroke:#2563eb;stroke-width:2.5}
    .lab{fill:#475569;font-size:12px}
    .pct{fill:#0d9488;font-size:14px;font-weight:700}
    .avg{stroke:#d97706;stroke-width:1.5;stroke-dasharray:5 3;fill:none}
  </style>
  <text x="20" y="26" class="ttl">PWM — la puissance moyenne varie avec le rapport cyclique</text>

  <!-- 25% -->
  <g transform="translate(40,50)">
    <text class="pct" x="-20" y="20" style="text-anchor:start">25 %</text>
    <!-- square wave 25% duty: high 1/4 of each 80px period -->
    <path class="sig" d="M60,45 L60,5 L80,5 L80,45 L140,45 L140,5 L160,5 L160,45 L220,45 L220,5 L240,5 L240,45 L300,45 L300,5 L320,5 L320,45 L380,45 L380,5 L400,5 L400,45 L460,45"/>
    <line class="avg" x1="60" y1="35" x2="460" y2="35"/>
    <text class="lab" x="470" y="39" fill="#d97706">≈ 25 % moy.</text>
    <text class="lab" x="500" y="20">LED faible / moteur lent</text>
  </g>

  <!-- 75% -->
  <g transform="translate(40,140)">
    <text class="pct" x="-20" y="20" style="text-anchor:start">75 %</text>
    <!-- 75% duty: high 3/4 -->
    <path class="sig" d="M60,45 L60,5 L140,5 L140,45 L160,45 L160,5 L240,5 L240,45 L260,45 L260,5 L340,5 L340,45 L360,45 L360,5 L440,5 L440,45 L460,45"/>
    <line class="avg" x1="60" y1="15" x2="460" y2="15"/>
    <text class="lab" x="470" y="19" fill="#d97706">≈ 75 % moy.</text>
    <text class="lab" x="500" y="34">LED forte / moteur rapide</text>
  </g>
  <text x="40" y="235" class="lab">Même fréquence, seule la largeur d'impulsion change. L'œil et le moteur « intègrent » → luminosité / vitesse proportionnelle.</text>
</svg>
