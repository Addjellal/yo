<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" font-family="'Segoe UI',Arial,sans-serif">
  <style>
    .ttl{fill:#1a2332;font-size:15px;font-weight:600}
    .rail{stroke:#334155;stroke-width:2.5}
    .wire{stroke:#2563eb;stroke-width:2;fill:none}
    .cn{fill:#1a2332;font-size:12px;font-weight:600;text-anchor:middle}
    .cd{fill:#475569;font-size:10px;text-anchor:middle}
    .coil{fill:none;stroke:#0d9488;stroke-width:2.5}
  </style>
  <text x="20" y="24" class="ttl">LADDER — marche/arrêt avec auto-maintien (le motif de base)</text>

  <!-- rails -->
  <line class="rail" x1="40" y1="50" x2="40" y2="180"/>
  <line class="rail" x1="560" y1="50" x2="560" y2="180"/>

  <!-- main rung -->
  <line class="wire" x1="40" y1="80" x2="120" y2="80"/>
  <!-- NO contact bp_marche -->
  <line class="wire" x1="120" y1="65" x2="120" y2="95"/>
  <line class="wire" x1="145" y1="65" x2="145" y2="95"/>
  <line class="wire" x1="145" y1="80" x2="230" y2="80"/>
  <text class="cn" x="132" y="52">bp_marche</text>
  <text class="cd" x="132" y="112">NO ┤ ├</text>
  <!-- NC contact bp_arret -->
  <line class="wire" x1="230" y1="65" x2="230" y2="95"/>
  <line class="wire" x1="255" y1="65" x2="255" y2="95"/>
  <line class="wire" x1="242" y1="65" x2="242" y2="95"/>
  <line class="wire" x1="255" y1="80" x2="420" y2="80"/>
  <text class="cn" x="242" y="52">bp_arret</text>
  <text class="cd" x="242" y="112">NC ┤/├</text>
  <!-- coil moteur -->
  <path class="coil" d="M475,68 A18,12 0 1,0 475,92"/>
  <path class="coil" d="M505,68 A18,12 0 1,1 505,92"/>
  <line class="wire" x1="420" y1="80" x2="475" y2="80"/>
  <line class="wire" x1="505" y1="80" x2="560" y2="80"/>
  <text class="cn" x="490" y="52">moteur</text>
  <text class="cd" x="490" y="112">( )</text>

  <!-- self-hold branch -->
  <line class="wire" x1="90" y1="80" x2="90" y2="150"/>
  <line class="wire" x1="90" y1="150" x2="120" y2="150"/>
  <line class="wire" x1="120" y1="135" x2="120" y2="165"/>
  <line class="wire" x1="145" y1="135" x2="145" y2="165"/>
  <line class="wire" x1="145" y1="150" x2="290" y2="150"/>
  <line class="wire" x1="290" y1="150" x2="290" y2="80"/>
  <text class="cn" x="132" y="182">moteur</text>
  <text class="cd" x="132" y="196">(contact de maintien)</text>
</svg>
