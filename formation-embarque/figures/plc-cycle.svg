<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" font-family="'Segoe UI',Arial,sans-serif">
  <!-- fond explicite : garde la figure lisible en dark mode (GitHub, PDF) -->
  <rect id="fond" width="100%" height="100%" fill="#ffffff"/>
  <style>
    .ttl{fill:#1a2332;font-size:15px;font-weight:600}
    .s1{fill:#dbeafe;stroke:#2563eb;stroke-width:2.5}
    .s2{fill:#fef3c7;stroke:#d97706;stroke-width:2.5}
    .s3{fill:#d1fae5;stroke:#0d9488;stroke-width:2.5}
    .st{fill:#1a2332;font-size:14px;font-weight:700;text-anchor:middle}
    .sub{fill:#475569;font-size:11px;text-anchor:middle}
    .arr{stroke:#334155;stroke-width:2.5;fill:none;marker-end:url(#ap)}
  </style>
  <defs>
    <marker id="ap" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#334155"/></marker>
  </defs>
  <text x="20" y="24" class="ttl">Le cycle automate (scan) — 1 à 10 ms, en boucle permanente</text>

  <rect class="s1" x="180" y="55" width="200" height="55" rx="10"/>
  <text class="st" x="280" y="80">1. LIRE les entrées</text>
  <text class="sub" x="280" y="98">→ mémoire image des %I (figée)</text>

  <rect class="s2" x="330" y="140" width="200" height="55" rx="10"/>
  <text class="st" x="430" y="165">2. EXÉCUTER</text>
  <text class="sub" x="430" y="183">le programme (LADDER/SCL/…)</text>

  <rect class="s3" x="180" y="225" width="200" height="55" rx="10"/>
  <text class="st" x="280" y="250">3. ÉCRIRE les sorties</text>
  <text class="sub" x="280" y="268">→ les %Q vers les actionneurs</text>

  <!-- arrows forming loop -->
  <path class="arr" d="M380,90 C450,100 470,115 460,138"/>
  <path class="arr" d="M400,195 C380,215 340,222 320,224"/>
  <path class="arr" d="M180,250 C90,245 90,90 178,80"/>
  <text class="sub" x="70" y="165" transform="rotate(-90 70 165)">boucle sans fin</text>
</svg>
