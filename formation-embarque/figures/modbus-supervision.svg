<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 260" font-family="'Segoe UI',Arial,sans-serif">
  <style>
    .ttl{fill:#1a2332;font-size:15px;font-weight:600}
    .plc{fill:#fef3c7;stroke:#d97706;stroke-width:2}
    .pc{fill:#dbeafe;stroke:#2563eb;stroke-width:2}
    .field{fill:#d1fae5;stroke:#0d9488;stroke-width:1.8}
    .t{fill:#1a2332;font-size:12px;font-weight:600;text-anchor:middle}
    .lab{fill:#475569;font-size:10px;text-anchor:middle}
    .wire{stroke:#334155;stroke-width:2;fill:none}
    .mono{font-family:monospace;font-size:10px;fill:#334155}
  </style>
  <text x="20" y="24" class="ttl">Chaîne automate ↔ supervision via Modbus TCP</text>

  <!-- Field sensors -->
  <rect class="field" x="20" y="60" width="90" height="30" rx="4"/><text class="t" x="65" y="80" font-size="11">Niveau (4-20mA)</text>
  <rect class="field" x="20" y="100" width="90" height="30" rx="4"/><text class="t" x="65" y="120" font-size="11">Pompes / vanne</text>

  <!-- PLC -->
  <rect class="plc" x="170" y="55" width="150" height="110" rx="8"/>
  <text class="t" x="245" y="76">Automate (Modicon)</text>
  <rect x="185" y="88" width="120" height="66" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1"/>
  <text class="mono" x="192" y="104">%MW100 état</text>
  <text class="mono" x="192" y="118">%MW101 niveau</text>
  <text class="mono" x="192" y="132">%MW104 mot de vie</text>
  <text class="mono" x="192" y="146">%MW110 commande</text>

  <!-- PC -->
  <rect class="pc" x="470" y="55" width="170" height="110" rx="8"/>
  <text class="t" x="555" y="76">Superviseur PC</text>
  <text class="lab" x="555" y="96">Python / Java</text>
  <text class="lab" x="555" y="112">lit états, journalise CSV</text>
  <text class="lab" x="555" y="128">écrit des DEMANDES</text>
  <text class="lab" x="555" y="144" fill="#dc2626">surveille le mot de vie</text>

  <!-- wires -->
  <line class="wire" x1="110" y1="75" x2="168" y2="90"/>
  <line class="wire" x1="110" y1="115" x2="168" y2="125"/>
  <line class="wire" x1="320" y1="110" x2="468" y2="110"/>
  <text class="t" x="395" y="100" font-size="11" fill="#2563eb">Modbus TCP</text>
  <text class="lab" x="395" y="126">port 502 · holding registers (FC03/06/16)</text>

  <text x="20" y="205" class="lab" style="text-anchor:start" font-size="12">La table d'échange (document) donne le SENS de chaque mot : Modbus ne transporte que des entiers 16 bits.</text>
  <text x="20" y="225" class="lab" style="text-anchor:start" font-size="12">Zones API→PC et PC→API disjointes. Le PC écrit des demandes ; l'automate valide, borne et décide seul des sorties.</text>
</svg>
