# Compilation et tests de MatLibre sur les trois systèmes.
name: construire

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  compiler:
    name: ${{ matrix.systeme }}
    runs-on: ${{ matrix.systeme }}
    strategy:
      fail-fast: false
      matrix:
        systeme: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Configurer et compiler (Unix)
        if: runner.os != 'Windows'
        run: ./outils/construire.sh --tests

      - name: Configurer et compiler (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\outils\construire.ps1 -Tests

      - name: Fabriquer les archives
        if: runner.os != 'Windows'
        run: ./outils/construire.sh --paquet

      - name: Déposer les archives
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: matlibre-${{ matrix.systeme }}
          path: build/MatLibre-*
          if-no-files-found: ignore
